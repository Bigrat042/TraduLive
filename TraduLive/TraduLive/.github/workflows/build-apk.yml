
name: Build TraduLive APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TraduLive

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Télécharger les dépendances natives
        run: bash scripts/fetch-native.sh

      - name: Tests unitaires
        run: gradle --no-daemon testDebugUnitTest

      - name: Compiler les APK
        run: gradle --no-daemon assembleDebug assembleRelease

      - name: Vérifier les APK
        run: |
          set -e
          cp app/build/outputs/apk/debug/app-debug.apk TraduLive-debug.apk
          cp app/build/outputs/apk/release/app-release.apk TraduLive.apk

          for apk in TraduLive.apk TraduLive-debug.apk; do
            unzip -l "$apk" | grep -q "lib/arm64-v8a/libsherpa-onnx-jni.so"
            unzip -l "$apk" | grep -q "lib/arm64-v8a/libonnxruntime.so"
            unzip -l "$apk" | grep -q "assets/silero_vad.onnx"
          done

          echo "APK vérifiés."

      - name: Publier les APK
        uses: actions/upload-artifact@v4
        with:
          name: TraduLive-APK
          path: |
            TraduLive/TraduLive.apk
            TraduLive/TraduLive-debug.apk
          if-no-files-found: error

      - name: Créer une Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.${{ github.run_number }}
          name: TraduLive 1.2.${{ github.run_number }}
          files: |
            TraduLive/TraduLive.apk
            TraduLive/TraduLive-debug.apk
